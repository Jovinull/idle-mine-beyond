<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <link
      rel="icon"
      type="image/png"
      href="%sveltekit.assets%/Images/gem.png"
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/montserrat/Montserrat-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <link
      rel="preload"
      href="%sveltekit.assets%/fonts/worksans/WorkSans-Regular.woff2"
      as="font"
      type="font/woff2"
      crossorigin
    />
    <script src="%sveltekit.assets%/theme-init.js"></script>
    %sveltekit.head%
  </head>
  <body data-sveltekit-preload-data="hover">
    <div style="display: contents">%sveltekit.body%</div>
  </body>
</html>
