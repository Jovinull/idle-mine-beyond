name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  native-windows:
    name: Native Tauri storage tests
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned pnpm and Node.js runtime
        uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@24.21.0
          cache: true

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust dependencies
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            apps/native/src-tauri/target
          key: windows-cargo-${{ hashFiles('apps/native/src-tauri/Cargo.lock') }}

      - name: Install workspace dependencies and build the static frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm --dir apps/web build

      - name: Test and check the native host
        run: |
          pnpm native:test
          pnpm native:check

  validate:
    name: Install, checks, build, and browser smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install pinned pnpm and Node.js runtime
        uses: pnpm/setup@v3
        with:
          version: 12.6.0
          runtime: node@24.21.0
          cache: true

      - name: Reconstruct and verify pinned research clones
        run: pnpm research:setup

      - name: Validate documentation and project Skills
        run: |
          pnpm docs:check
          pnpm skills:check

      - name: Run formatting, lint, type, unit, parity, and build checks
        run: pnpm check

      - name: Install Playwright browser
        run: pnpm exec playwright install --with-deps chromium firefox webkit

      - name: Verify pinned Remix oracle corpus
        run: pnpm test:reference

      - name: Verify offline cold-start restores in Firefox and WebKit
        run: pnpm test:e2e:offline-cold-start:browsers

      - name: Verify aligned and affordability-stop purchase exports in Firefox and WebKit
        run: pnpm test:e2e:upgrade-purchase-export:browsers

      - name: Verify Prestige exports in Firefox and WebKit
        run: pnpm test:e2e:powers-prestige:browsers

      - name: Verify four-byte save inputs in all browsers
        run: pnpm test:e2e:save-codec:four-byte:browsers

      - name: Verify canonical Unicode save import in all browsers
        run: pnpm test:e2e:save-unicode-import:browsers

      - name: Verify complete all-upgrade purchase export in all browsers
        run: pnpm test:e2e:all-upgrades-export:browsers

      - name: Verify stale Settings save interleaving in Firefox and WebKit
        run: pnpm test:e2e:cross-tab-settings:browsers

      - name: Run browser smoke test
        run: pnpm test:e2e

      - name: Verify save codec outputs in Firefox
        run: pnpm test:e2e:save-codec:firefox

      - name: Verify save codec outputs in WebKit
        run: pnpm test:e2e:save-codec:webkit

      - name: Verify live save exports in Firefox and WebKit
        run: pnpm test:e2e:save-export:browsers

      - name: Verify stale cross-tab saves in Firefox and WebKit
        run: pnpm test:e2e:cross-tab:browsers

      - name: Verify malformed save imports in Firefox and WebKit
        run: pnpm test:e2e:save-import-errors:browsers

      - name: Verify manual offline save imports in Firefox and WebKit
        run: pnpm test:e2e:offline-import:browsers

      - name: Verify optional-group save imports in Firefox and WebKit
        run: pnpm test:e2e:legacy-import:browsers

      - name: Verify Hard Reset cancellation in Firefox and WebKit
        run: pnpm test:e2e:hard-reset:browsers

      - name: Verify confirmed Hard Reset in Firefox and WebKit
        run: pnpm test:e2e:hard-reset-confirmed:browsers

      - name: Verify recovery bundle selection in Firefox and WebKit
        run: pnpm test:e2e:recovery-file:browsers

      - name: Verify finite upgrade cap purchases in Firefox and WebKit
        run: pnpm test:e2e:upgrade-caps:browsers

      - name: Verify upgrade autosave window in Firefox and WebKit
        run: pnpm test:e2e:upgrade-persistence:browsers

      - name: Verify baseline and selected-Gem pickaxe craft persistence in Firefox and WebKit
        run: pnpm test:e2e:craft-replacement:browsers

      - name: Verify pickaxe craft no-save branches in Firefox and WebKit
        run: pnpm test:e2e:craft-no-save:browsers

      - name: Verify special-anchor pickaxe export in Firefox and WebKit
        run: pnpm test:e2e:craft-anchor-export:browsers

      - name: Verify save storage failures in Firefox and WebKit
        run: pnpm test:e2e:save-storage:browsers

      - name: Upload Playwright diagnostic evidence
        if: always() && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-evidence-${{ github.run_number }}
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Run project site browser tests
        run: pnpm test:site
